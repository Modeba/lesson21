<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>lesson 21</title>
	</head>
	<body>
		<form id="signup-form" action="#">
			<h1>Form title</h1>

			<div>
				<label for="personal-number">personal number</label>
				<input
					type="text"
					id="personal-number"
					name="personal_number"
					required
					minlength="11"
					maxlength="11"
					inputmode="numeric"
					pattern="\d{11}"
					title="Must be exactly 11 digits"
				/>
			</div>

			<div>
				<label for="mobile-number">mobile number</label>
				<input
					type="text"
					id="mobile-number"
					name="mobile_number"
					required
					minlength="9"
					maxlength="9"
					inputmode="numeric"
					pattern="\d{9}"
					title="Must be exactly 9 digits"
				/>
			</div>

			<div>
				<label for="job-description">job description</label>
				<textarea
					id="job-description"
					name="job_description"
					required
					maxlength="50"
					rows="3"
				></textarea>
			</div>

			<button type="submit">submit</button>
		</form>
	</body>
</html>
